<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FameGo — Email verified</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #070809; color: #F8FAFC;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    background: #111419; border: 1px solid #1E232B; border-radius: 20px;
    max-width: 440px; width: 100%; padding: 40px 32px; text-align: center;
  }
  .logo { font-size: 30px; letter-spacing: 2px; color: #fff; }
  .logo span { color: #F6B941; }
  .sub { color: #6E7683; font-size: 11px; letter-spacing: 3px; margin-top: 4px; }
  .icon {
    width: 64px; height: 64px; border-radius: 50%; margin: 24px auto 16px;
    display: flex; align-items: center; justify-content: center; font-size: 30px;
  }
  .icon.ok { background: rgba(67,209,158,.15); border: 1px solid #43D19E; }
  .icon.err { background: rgba(255,90,95,.12); border: 1px solid #FF5A5F; }
  h1 { font-size: 22px; margin-bottom: 8px; }
  p { color: #A6ADB8; font-size: 14px; line-height: 1.6; }
  .btn {
    display: block; margin-top: 24px; padding: 14px; border-radius: 14px;
    background: #F6B941; color: #1A1408; font-weight: 700; font-size: 15px;
    text-decoration: none;
  }
  .ghost {
    display: block; margin-top: 12px; padding: 13px; border-radius: 14px;
    border: 1px solid #1E232B; color: #A6ADB8; font-size: 13px; text-decoration: none;
  }
  .fine { margin-top: 20px; color: #6E7683; font-size: 11px; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="logo">FAME<span>GO</span></div>
  <div class="sub">FAMEBROS STUDIO</div>
  <div class="icon ok" id="icon">✓</div>
  <h1 id="title">You're verified</h1>
  <p id="msg">Your email is confirmed. You can close this page now and return to the FameGo app to sign in.</p>
  <a class="btn" href="famego://auth/callback">Open FameGo app</a>
  <a class="ghost" href="mailto:famebros.studio@gmail.com?subject=Wrong%20account%20-%20not%20me">No, it's not me? Report it</a>
  <div class="fine">If you didn't create a FameGo account, just ignore this page — nothing else happens.</div>
</div>
<script>
  // Supabase appends error details as hash/query when verification fails.
  var hash = window.location.hash || "";
  var search = window.location.search || "";
  var combined = search + "&" + hash.replace(/^#/, "");
  function pick(key) {
    var m = combined.match(new RegExp("[?&#]" + key + "=([^&]+)"));
    return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : "";
  }
  var err = pick("error_description") || pick("error") || "";
  if (err) {
    document.getElementById("icon").className = "icon err";
    document.getElementById("icon").textContent = "!";
    document.getElementById("title").textContent = "Link didn't work";
    document.getElementById("msg").textContent = err + " Please open FameGo and request a fresh link from Sign in.";
  }
</script>
</body>
</html>
